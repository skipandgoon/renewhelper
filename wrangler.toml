name = "renewhelper"
main = "_worker.js"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
preview_urls = false

[env.production]
name = "renewhelper"

[env.staging]
name = "renewhelper-staging"

# 绑定 KV 数据库
# 注意：在一键部署过程中，Cloudflare 会提示您创建一个新的 KV 并自动填充 ID
[[kv_namespaces]]
binding = "RENEW_KV"
id = "bcb3237b002a4bffba5b15a48906d3e7"  # 本地开发占位符。部署前请运行 `npx wrangler kv:namespace create RENEW_KV` 并填入真实 ID

# 设置定时任务 (Cron Triggers)
# 这里设置每 30 分钟检查一次 (0,30 * * * *)
# 必须设置这个，否则自动续期和通知功能无法触发
[triggers]
crons = ["0,30 * * * *"]


